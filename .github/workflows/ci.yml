name: Spectoom CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static checks
        run: |
          python -m py_compile server.py reset_demo.py
          node --check static/app.js

      - name: Python regression and HTTP tests
        run: python -m unittest discover -s tests -v

      - name: JavaScript tests
        run: node --test tests/*.test.cjs

      - name: Docker build
        run: docker build -t spectoom:${{ github.sha }} .
